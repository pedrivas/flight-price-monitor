name: monitor-passagens

on:
  schedule:
    # a cada ~20 min, em minutos deslocados da virada da hora (o agendador do
    # GitHub estrangula cron frequente e no topo da hora). Ver ADR-006.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:          # botão manual

permissions:
  contents: write             # p/ commitar o history.db de volta

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar tick
        env:
          PYTHONPATH: src
          PRICE_SOURCE: ${{ vars.PRICE_SOURCE || 'fastflights' }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
        run: python -m monitor.main

      - name: Persistir histórico
        if: always()   # salva o que foi coletado mesmo se o envio falhar
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -f data/history.db || true
          git commit -m "chore: atualiza estado do monitor [skip ci]" || echo "sem mudanças"
          git push || true
