# Rotas monitoradas. Cada item gera uma busca por execução.
#
# origin / dest: código IATA do aeroporto ou cidade (ex: GRU, REC, LIS)
# depart_range: janela de datas de ida a varrer (a busca testa alguns dias dentro dela)
# return_after_days: [min, max] noites de viagem (omita para só-ida)
# adults: nº de passageiros
# target_price: dispara alerta se o preço <= esse valor (na moeda de `currency`)
# drop_pct: dispara também se o preço cair >= esse % vs. a mediana dos últimos 30 dias
# nonstop: true = só voos diretos

currency: BRL

# Viagem set/2026: ida 04–11/set, volta 18–25/set (7–21 noites; a busca usa o
# ponto médio, ~14 noites, que cai dentro da janela de volta para toda data de ida).
# Melhor preço visto em 31/08 no comentário de cada rota.
routes:
  - name: "São Paulo → Salvador"
    origin: GRU
    dest: SSA
    depart_range: ["2026-09-04", "2026-09-11"]
    return_after_days: [7, 21]
    adults: 1
    target_price: 1300   # visto: 1237 (LATAM, direto)
    drop_pct: 15
    nonstop: false

  - name: "São Paulo → Porto Seguro"
    origin: GRU
    dest: BPS
    depart_range: ["2026-09-04", "2026-09-11"]
    return_after_days: [7, 21]
    adults: 1
    target_price: 1550   # visto: 1521 (LATAM, direto)
    drop_pct: 15
    nonstop: false

  - name: "São Paulo → Belém"
    origin: GRU
    dest: BEL
    depart_range: ["2026-09-04", "2026-09-11"]
    return_after_days: [7, 21]
    adults: 1
    target_price: 1700   # visto: 1654 (Azul, 1 escala)
    drop_pct: 15
    nonstop: false

  - name: "São Paulo → Santiago"
    origin: GRU
    dest: SCL
    depart_range: ["2026-09-04", "2026-09-11"]
    return_after_days: [7, 21]
    adults: 1
    target_price: 1750   # visto: 1707 (LATAM, direto)
    drop_pct: 15
    nonstop: false
